# Site Settings

title: Sensei Mike Tech
email: myemail@example.com
description: >-
  Write description here
baseurl: ""
url: "https://senseimiketech.github.io"

timezone: "America/Toronto"

# Build Settings

remote_theme: "mmistakes/minimal-mistakes@4.28.1"

show_downloads: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-remote-theme
  - jekyll-include-cache


defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single


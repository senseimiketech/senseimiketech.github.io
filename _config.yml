# Site Settings

title: Sensei Mike Tech
email: myemail@example.com
description: >-
  Write description here
baseurl: ""
url: "https://senseimiketech.github.io"

locale : "en-CA"
timezone: "America/Toronto"
permalink: /:categories/:title/
# paginate: 5 # amount of posts to show
# paginate_path: /page:num/

# Build Settings

remote_theme: "mmistakes/minimal-mistakes@4.28.1"

show_downloads: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jemoji

# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
   # assets 
   - scope:
      path: "assets/**"
    values:
      sitemap: false

# Reading Files
include:
  - .htaccess
  - _pages
# exclude:

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/


# Site Footer
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/senseimiketech" 
    - label: "Facebook"
      icon: "fab fa-fw fa-square-facebook"
      # url:
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      # url:
  since: "2026"

 
